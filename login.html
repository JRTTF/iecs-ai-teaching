<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - 智慧學習導航</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="new-page.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <h1>智慧學習<span class="highlight-gold">導航</span></h1>
      <p class="login-caption">FCU IECS 專題系統登入</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">帳號</label>
        <input type="text" id="username" class="form-control" placeholder="請輸入學號或帳號" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密碼</label>
        <input type="password" id="password" class="form-control" placeholder="請輸入密碼" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="captcha">驗證碼</label>
        <div class="captcha-group">
          <input type="text" id="captcha" class="form-control" placeholder="輸入右側文字" required autocomplete="off">
          <div class="captcha-image" id="captcha-image" title="點擊重新產生"></div>
        </div>
      </div>

      <p id="login-error" class="login-error"></p>

      <div class="login-options">
        <label class="checkbox-label">
          <input type="checkbox" class="gold-checkbox"> 記住我
        </label>
        <a href="forgot-password.html" class="login-link">忘記密碼？</a>
      </div>

      <button type="submit" class="action-btn solid-btn btn-block">登入系統</button>
    </form>

    <div class="register-prompt">
      還沒有帳號嗎？ <a href="register.html">立即註冊</a>
    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
