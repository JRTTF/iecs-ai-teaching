<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智慧簡報 | AI 智慧教材</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="Style.css">
  <style>
    /* 讓原本的 slide-preview 區塊能嵌入生成的簡報 */
    .slide-preview { position: relative; overflow: hidden; padding: 0; }
    .slide-preview iframe { width: 100%; height: 100%; border: 0; display: block; }
    .slide-preview.is-empty iframe { display: none; }
    .slide-preview .preview-msg { display: none; }
    .slide-preview.is-empty .preview-msg { display: block; }
    /* 生成進度條：細長一條，跟著後端回報的百分比走 */
    .gen-bar { display: none; height: 6px; border-radius: 3px; overflow: hidden;
      background: rgba(128,128,128,.18); margin: 12px auto 0; max-width: 520px; }
    .gen-bar.show { display: block; }
    .gen-bar > span { display: block; height: 100%; width: 0; border-radius: 3px;
      background: var(--accent-color); transition: width .6s ease; }
  </style>
</head>
<body>
<div class="app-container">

  <nav class="primary-sidebar">
    <div class="nav-top-group">
      <button class="icon-btn" id="sidebar-toggle-btn" title="展開/收合工作區">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <a href="index.html" class="icon-btn" title="主頁">
        <span class="material-symbols-outlined">home</span>
      </a>
      <a href="chat.html" class="icon-btn" title="AI 對話">
        <span class="material-symbols-outlined">chat</span>
      </a>
      <a href="text-page.html" class="icon-btn" title="文字轉譯">
        <span class="material-symbols-outlined">description</span>
      </a>
      <a href="presentation.html" class="icon-btn active" title="智慧簡報">
        <span class="material-symbols-outlined">slideshow</span>
      </a>
      <a href="video-page.html" class="icon-btn" title="影音合成">
        <span class="material-symbols-outlined">video_library</span>
      </a>
      <a href="quiz.html" class="icon-btn" title="隨堂測驗">
        <span class="material-symbols-outlined">quiz</span>
      </a>
      <a href="forum.html" class="icon-btn" title="知識論壇">
        <span class="material-symbols-outlined">forum</span>
      </a>
    </div>
    <div class="nav-bottom-group">
      <button class="icon-btn" title="登出">
        <span class="material-symbols-outlined">logout</span>
      </button>
    </div>
  </nav>

  <aside class="secondary-sidebar" id="main-sidebar">
    <div class="sidebar-header"><h2>簡報大綱</h2></div>
    <div class="history-section">
      <h3 class="section-title">章節清單</h3>
      <ul class="history-list" id="outline-list">
        <li class="history-item"><span class="hash">#</span> 尚未生成簡報</li>
      </ul>
    </div>
    <div class="user-profile">
      <div class="avatar">林</div>
      <div class="user-info">
        <div class="user-name">林柔杉</div>
        <div class="user-status"><span class="status-dot"></span> 已登入</div>
      </div>
      <button class="icon-btn settings-btn"><span class="material-symbols-outlined">settings</span></button>
    </div>
  </aside>

  <main class="main-content">
    <a href="index.html" class="home-btn">
      <span class="material-symbols-outlined">home</span> 返回主頁
    </a>
    <div class="hero-section">
      <h1 class="main-title">智慧<span class="highlight">簡報預覽</span></h1>
      <p class="subtitle" id="hero-subtitle">AI 已為您生成 10 頁投影片，您可以進行編輯或直接匯出。</p>
      <div class="gen-bar" id="gen-bar"><span></span></div>
    </div>
    <div class="slide-preview is-empty" id="slide-preview">
      <span class="preview-msg" id="preview-msg">Slide #1: 機器人學概論 - 課程標題</span>
      <iframe id="slide-frame" title="AI 生成簡報"></iframe>
    </div>
    <div class="slide-controls">
      <button class="upload-btn" id="prev-btn"><span class="material-symbols-outlined">chevron_left</span> 上一步</button>
      <span class="page-indicator" id="page-indicator">1 / 10</span>
      <button class="upload-btn" id="next-btn">下一步 <span class="material-symbols-outlined">chevron_right</span></button>
      <button class="generate-main-btn" id="pptx-btn"><span class="material-symbols-outlined">download</span> 導出 PPTX</button>
    </div>
    <div class="quick-tools-header"><span>投影片縮圖預覽</span></div>
    <div class="slide-thumb-container" id="thumb-container"></div>
    <footer class="main-footer"><span>FCU IECS 畢業專題 | 2026</span></footer>
  </main>

</div>
<script src="common.js"></script>
<script src="eduai.js"></script>
<script>
(function () {
  const preview   = document.getElementById('slide-preview');
  const msg       = document.getElementById('preview-msg');
  const frame     = document.getElementById('slide-frame');
  const subtitle  = document.getElementById('hero-subtitle');
  const genBar    = document.getElementById('gen-bar');
  function setBar(pct) {   // pct=null 隱藏
    if (pct === null) { genBar.classList.remove('show'); return; }
    genBar.classList.add('show');
    genBar.firstElementChild.style.width = Math.max(2, Math.min(100, pct)) + '%';
  }
  const pageInd   = document.getElementById('page-indicator');
  const outline   = document.getElementById('outline-list');
  const thumbs    = document.getElementById('thumb-container');
  const prevBtn   = document.getElementById('prev-btn');
  const nextBtn   = document.getElementById('next-btn');
  const pptxBtn   = document.getElementById('pptx-btn');

  let slideUrl = '';
  let titles   = [];
  let cur      = 0;
  let topic    = '';
  let presId   = '';   // 後端持有的簡報編號，匯出 PPTX 時用它取回完整內容

  function setMsg(text) { msg.textContent = text; }

  // 簡報載入前，先讓上一步/下一步/導出停用，避免按了沒反應
  function setControlsEnabled(on) {
    prevBtn.disabled = !on;
    nextBtn.disabled = !on;
    pptxBtn.disabled = !on;
  }
  setControlsEnabled(false);

  // 切換到第 i 頁：優先直接呼叫簡報內的 show()，失敗才退回 hash 導航
  function showPage(i) {
    if (!titles.length) return;
    cur = (i + titles.length) % titles.length;
    try {
      frame.contentWindow.show(cur);
    } catch {
      frame.src = `${slideUrl}#${cur}`;
    }
    pageInd.textContent = `${cur + 1} / ${titles.length}`;
    [...outline.children].forEach((li, k) => li.classList.toggle('active', k === cur));
    [...thumbs.children].forEach((d, k) => d.classList.toggle('active', k === cur));
  }

  function renderOutline() {
    outline.innerHTML = titles
      .map((t, i) => `<li class="history-item${i === 0 ? ' active' : ''}" data-page="${i}">` +
                     `<span class="hash">#</span> ${String(i + 1).padStart(2, '0')} ${t}</li>`)
      .join('');
    [...outline.children].forEach(li =>
      li.addEventListener('click', () => showPage(Number(li.dataset.page))));

    thumbs.innerHTML = titles
      .map((_, i) => `<div class="slide-thumb${i === 0 ? ' active' : ''}" data-page="${i}"></div>`)
      .join('');
    [...thumbs.children].forEach(d =>
      d.addEventListener('click', () => showPage(Number(d.dataset.page))));
  }

  prevBtn.addEventListener('click', () => showPage(cur - 1));
  nextBtn.addEventListener('click', () => showPage(cur + 1));

  pptxBtn.addEventListener('click', async () => {
    if (!titles.length) return;
    pptxBtn.disabled = true;
    setMsg('產生 PPTX 檔案中…');
    try {
      let blob;
      if (presId) {
        blob = await EduAI.exportPptxById(presId);          // 完整內容版
      } else {
        // 退路：只剩標題可用。格式必須是後端解析得了的 [投影片N]，
        // 之前寫成 [N] 後端完全解析不到，導致匯出只有封面一頁。
        const outlineText = titles
          .map((t, i) => '[投影片' + (i + 1) + '] ' + t)
          .join(String.fromCharCode(10));
        blob = await EduAI.exportPptx(outlineText, topic || '課程簡報');
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${topic || '課程簡報'}.pptx`;
      a.click();
    } catch (e) {
      subtitle.textContent = 'PPTX 匯出失敗：' + e.message;
    } finally {
      pptxBtn.disabled = false;
    }
  });

  // ── 載入：從首頁引導流程取得主題，自動生成簡報 ──
  (async function init() {
    const guide = EduAIGuide.load();
    topic = guide && guide.topic ? guide.topic : '';

    if (!topic) {
      preview.classList.add('is-empty');
      setMsg('尚未選定主題 — 請回主頁選擇學習主題後開始生成');
      subtitle.textContent = '請先回到主頁，透過引導流程輸入您想學習的主題。';
      pageInd.textContent = '— / —';
      return;
    }

    if (!(await EduAI.isOnline())) {
      preview.classList.add('is-empty');
      setMsg('無法連線到 AI 服務');
      subtitle.textContent = eduaiOfflineMessage();
      return;
    }

    subtitle.textContent = `正在為「${topic}」生成簡報，本地 AI 運算需數分鐘，請稍候…`;
    setMsg('AI 生成中…');
    setBar(2);

    try {
      const result = await EduAI.generateSlides(
        topic, (guide && guide.content) || '', '瑞士國際',
        (txt, pct) => { subtitle.textContent = txt; setBar(pct); });
      setBar(100);
      setTimeout(() => setBar(null), 800);

      slideUrl = result.url;
      frame.src = slideUrl;
      preview.classList.remove('is-empty');

      presId = result.presId || '';
      if (result.presId) {
        const info = await EduAI.presentationInfo(result.presId);
        titles = info.titles || [];
        renderOutline();
        pageInd.textContent = `1 / ${titles.length}`;
        subtitle.textContent = `AI 已為您生成 ${titles.length} 頁投影片，您可以進行編輯或直接匯出。`;
        setControlsEnabled(true);
      }
    } catch (e) {
      preview.classList.add('is-empty');
      setMsg('生成失敗');
      subtitle.textContent = '簡報生成失敗：' + e.message;
      setBar(null);
    }
  })();
})();
</script>
</body>
</html>
