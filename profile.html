<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人設定 - 智慧學習導航</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="new-page.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
<div class="app-container">

    <nav class="primary-sidebar">
        <div class="nav-top-group">
            <button class="icon-btn" id="sidebar-toggle-btn" title="展開/收合工作區">
                <span class="material-symbols-outlined">menu</span>
            </button>
            <a href="index.html" class="icon-btn" title="開始新對話">
                <span class="material-symbols-outlined">add_circle</span>
            </a>
      <a href="chat.html" class="icon-btn" title="AI 對話">
        <span class="material-symbols-outlined">chat</span>
      </a>
      <a href="text-page.html" class="icon-btn" title="文字轉譯">
                <span class="material-symbols-outlined">description</span>
            </a>
            <a href="presentation.html" class="icon-btn" title="智慧簡報">
                <span class="material-symbols-outlined">slideshow</span>
            </a>
            <a href="video-page.html" class="icon-btn" title="影音合成">
                <span class="material-symbols-outlined">video_library</span>
            </a>
            <a href="quiz.html" class="icon-btn" title="隨堂測驗">
                <span class="material-symbols-outlined">assignment</span>
            </a>
            <a href="forum.html" class="icon-btn" title="知識論壇">
                <span class="material-symbols-outlined">forum</span>
            </a>
        </div>
        <div class="nav-bottom-group">
            <button class="icon-btn" title="登出">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </nav>

    <aside class="secondary-sidebar" id="main-sidebar">
        <div class="sidebar-header">
            <h2>系統工作區</h2>
        </div>
        <div class="history-section">
            <h3 class="section-title">最近活動</h3>
            <ul class="history-list">
                <li class="history-item"><span class="hash">#</span> 當前講義生成</li>
            </ul>
        </div>

        <div class="user-profile">
            <div class="avatar">林</div>
            <div class="user-info">
                <div class="user-name">林柔杉</div>
                <div class="user-status"><span class="status-dot"></span> 已登入</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <a href="index.html" class="home-btn">
            <span class="material-symbols-outlined">home</span> 返回主頁
        </a>
        <div class="page-header">
            <h1 class="page-title">帳戶與<span class="highlight-gold">設定</span></h1>
            <p class="page-subtitle">管理您的個人資料、身分權限與登入憑證。</p>
        </div>

        <div class="content-card profile-card">
            <form>
                <div class="profile-header-row">
                    <div class="author-avatar profile-avatar-lg" id="profile-avatar">林</div>
                    <div>
                        <button type="button" class="action-btn outline-btn avatar-upload-btn">更換大頭貼</button>
                        <input type="file" id="avatar-file-input" class="js-hidden" accept="image/jpeg,image/png">
                        <p class="hint-text">支援 JPG, PNG 格式，檔案上限 2MB</p>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group--grow-1">
                        <label class="form-label">身分設定</label>
                        <select class="form-control" id="profile-role">
                            <option value="student">學生 (Student)</option>
                            <option value="teacher">教師 (Teacher)</option>
                        </select>
                    </div>
                    <div class="form-group form-group--grow-2">
                        <label class="form-label">學校名稱</label>
                        <input type="text" class="form-control" id="profile-school" placeholder="請輸入學校名稱">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group form-group--grow-1">
                        <label class="form-label">真實姓名</label>
                        <input type="text" class="form-control" id="profile-name" placeholder="您的姓名">
                    </div>
                    <div class="form-group form-group--grow-1">
                        <label class="form-label">顯示暱稱</label>
                        <input type="text" class="form-control" id="profile-nickname" placeholder="論壇上顯示的名稱">
                    </div>
                </div>

                <div class="divider">
                    <span>登入憑證設定</span>
                </div>

                <div class="form-group">
                    <label class="form-label">登入帳號 (學號 / Email)</label>
                    <input type="text" class="form-control" id="profile-account" placeholder="設定登入帳號">
                </div>

                <div class="form-group">
                    <label class="form-label">修改密碼</label>
                    <input type="password" class="form-control" id="profile-password" placeholder="若不修改請留白">
                </div>

                <p id="profile-message" class="login-error"></p>

                <div class="form-actions">
                    <button type="button" class="action-btn solid-btn btn-lg" id="profile-save-btn">
                        <span class="material-symbols-outlined icon-20">save</span> 儲存設定
                    </button>
                </div>
            </form>
        </div>

        <div class="footer-text">FCU IECS 畢業專題 | 2026</div>
    </main>
</div>
<script src="common.js"></script>
</body>
</html>
