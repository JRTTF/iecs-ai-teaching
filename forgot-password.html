<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘記密碼 - 智慧學習導航</title>
  <link rel="stylesheet" href="Style.css">
  <link rel="stylesheet" href="new-page.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <h1>智慧學習<span class="highlight-gold">導航</span></h1>
      <p class="login-caption">重設你的登入密碼</p>
    </div>

    <form id="forgot-password-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="fp-account">帳號</label>
        <input type="text" id="fp-account" class="form-control" placeholder="請輸入學號或帳號" required autocomplete="off">
      </div>

      <div class="form-group">
        <label class="form-label" for="fp-new-password">新密碼</label>
        <input type="password" id="fp-new-password" class="form-control" placeholder="至少 6 碼" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="fp-new-password-confirm">確認新密碼</label>
        <input type="password" id="fp-new-password-confirm" class="form-control" placeholder="再輸入一次" required>
      </div>

      <p id="forgot-password-message" class="login-error"></p>

      <button type="submit" class="action-btn solid-btn btn-block">重設密碼</button>
    </form>

    <div class="register-prompt">
      想起密碼了？ <a href="login.html">返回登入</a>
    </div>
  </div>
</div>
<script src="common.js"></script>
</body>
</html>
